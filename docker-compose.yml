          s.end(JSON.stringify({status:'ok',service:'notification-service',phase:'stub'}));
        }).listen(3006);
        console.log('[notification-service] Phase 1 stub — port 3006');
      \""
    environment:
      PORT: 3006
    ports:
      - "3006:3006"
    networks:
      - nova-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3006/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  recording-service:
    # PHASE 1 STUB — Phase 8 da real NestJS kodi bilan almashtiriladi
    image: node:20-alpine
    command: >
      sh -c "node -e \"
        const h=require('http');
        h.createServer((q,s)=>{
          s.writeHead(200,{'Content-Type':'application/json'});
          s.end(JSON.stringify({status:'ok',service:'recording-service',phase:'stub'}));
        }).listen(3007);
        console.log('[recording-service] Phase 1 stub — port 3007');
      \""
    environment:
      PORT: 3007
    ports:
      - "3007:3007"
    networks:
      - nova-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3007/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── API Gateway ──────────────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.0
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic.yml:/traefik/dynamic.yml:ro
    networks:
      - nova-net
    restart: unless-stopped

  # ─── Monitoring ───────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - nova-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - nova-net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - nova-net
    restart: unless-stopped

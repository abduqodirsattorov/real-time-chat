          s.writeHead(200,{'Content-Type':'application/json'});
          s.end(JSON.stringify({status:'ok',service:'presence-service',phase:'stub'}));
        }).listen(3003);
        console.log('[presence-service] Phase 1 stub — port 3003');
      \""
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    networks:
      - nova-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  media-service:
    # PHASE 1 STUB — Phase 4 da real NestJS kodi bilan almashtiriladi
    image: node:20-alpine
    command: >
      sh -c "node -e \"
        const h=require('http');
        h.createServer((q,s)=>{
          s.writeHead(200,{'Content-Type':'application/json'});
          s.end(JSON.stringify({status:'ok',service:'media-service',phase:'stub'}));
        }).listen(3004);
        console.log('[media-service] Phase 1 stub — port 3004');
      \""
    environment:
      PORT: 3004
    ports:
      - "3004:3004"
    networks:
      - nova-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  call-service:
    # PHASE 1 STUB — Phase 6 da real NestJS kodi bilan almashtiriladi
    image: node:20-alpine
    command: >
      sh -c "node -e \"
        const h=require('http');
        h.createServer((q,s)=>{
          s.writeHead(200,{'Content-Type':'application/json'});
          s.end(JSON.stringify({status:'ok',service:'call-service',phase:'stub'}));
        }).listen(3005);
        console.log('[call-service] Phase 1 stub — port 3005');
      \""
    environment:
      PORT: 3005
    ports:
      - "3005:3005"
    networks:
      - nova-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  notification-service:
    # PHASE 1 STUB — Phase 5 da real NestJS kodi bilan almashtiriladi
    image: node:20-alpine
    command: >
      sh -c "node -e \"
        const h=require('http');
        h.createServer((q,s)=>{

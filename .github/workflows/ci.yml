name: CI Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  schema-drift-check:
    name: Prisma Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify All Services Match Shared Schema
        run: |
          for file in services/*/prisma/schema.prisma; do
            echo "Checking $file against shared/prisma/schema.prisma..."
            cmp -s shared/prisma/schema.prisma "$file" || {
              echo "❌ SCHEMA DRIFT DETECTED in $file!"
              diff -u shared/prisma/schema.prisma "$file"
              exit 1
            }
          done
          echo "✅ All service schemas are 100% in sync with shared schema!"

  unit-tests:
    name: Microservice Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Auth Service
        run: |
          cd services/auth
          npm ci || npm install
          npx prisma generate
          npm test

      - name: Test Chat Service
        run: |
          cd services/chat
          npm ci || npm install
          npx prisma generate
          npm test

      - name: Test Call Service
        run: |
          cd services/call
          npm ci || npm install
          npx prisma generate
          npm test

      - name: Test Presence Service
        run: |
          cd services/presence
          npm ci || npm install
          npx prisma generate
          npm test

  security-tests:
    name: Integration & Security Hardening Verification
    runs-on: ubuntu-latest
    needs: [schema-drift-check, unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Stack
        run: |
          docker compose up -d postgres redis rabbitmq meilisearch
          docker compose up -d --build
          sleep 15
          docker compose ps

      - name: Run Integration Tests
        run: |
          cd tests/integration
          npm ci || npm install
          npm test

# LiveKit Server — Local Development (Windows WSL2 / Docker Desktop)
# Bridge network + port mapping:
#   - Browser: ws://localhost:7880 (Docker Desktop forwards to container)
#   - node_ip 127.0.0.1 — LiveKit advertises this in ICE candidates so
#     the browser finds it through Docker Desktop's port mapping

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  use_ice_lite: false
  node_ip: "127.0.0.1"

keys:
  devkey: devsecret_change_me_32_chars_minimum_xx

room:
  auto_create: false
  max_participants: 10
  empty_timeout: 60
  departure_timeout: 20
  enable_remote_unmute: true

redis:
  address: redis:6379

logging:
  level: info
  json: true

turn:
  enabled: false

webhook:
  api_key: devkey
  urls:
    - http://call-service:3005/livekit/webhook
    - http://recording-service:3007/webhooks/livekit/egress

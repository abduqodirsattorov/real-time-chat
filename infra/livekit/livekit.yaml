# LiveKit Server — Local Development (Windows WSL2 / Docker Desktop)
# network_mode: host Linux'da ishlaydigan edi, Windows'da ishlamaydi.
# Bridge network + port mapping ishlatamiz:
#   - Browser localhost:7880 (HTTP signaling) ga ulanadi
#   - WebRTC UDP: 50000-50100 portlar Docker Desktop orqali forward qilinadi
# node_ip: 127.0.0.1 — browser ulanishlarini localhost orqali yo'naltiradi

port: 7880
bind_addresses:
  - ""

# WebRTC'da browser qaysi IP:port'ga UDP yuborishi kerakligini bilishi uchun
# node_ip localhost bo'lishi kerak — Docker Desktop portlarni host'ga forward qiladi
node_ip: "127.0.0.1"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  use_ice_lite: false

keys:
  devkey: devsecret_change_me_32_chars_minimum_xx

room:
  auto_create: false
  max_participants: 10
  empty_timeout: 60
  departure_timeout: 20
  enable_remote_unmute: true

# Bridge network'da redis service nomini ishlatamiz
redis:
  address: redis:6379

logging:
  level: info
  json: true

turn:
  enabled: false

webhook:
  api_key: devkey
  urls:
    - http://call-service:3005/livekit/webhook
    - http://recording-service:3007/webhooks/livekit/egress
